services:
  - type: web
    name: sistema-facturas-procesador
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: facturas-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

  - type: web
    name: sistema-facturas-web
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: node web-server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: facturas-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: WEB_PORT
        value: 3001

databases:
  - name: facturas-db
    databaseName: facturas_db
    user: facturas_user