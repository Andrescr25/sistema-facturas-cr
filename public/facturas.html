<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📄 Ver Facturas - Distribuidora Tachi</title>
    <link rel="stylesheet" href="css/facturas.css">
    <style>
        .btn-actualizar {
            background-color: #17a2b8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-actualizar:hover {
            background-color: #138496;
            transform: translateY(-2px);
        }
        
        .btn-actualizar.loading {
            pointer-events: none;
            opacity: 0.7;
        }
        
        .btn-actualizar.loading::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            margin-top: -8px;
            margin-left: -8px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.success {
            background: #28a745;
        }
        
        .toast.error {
            background: #dc3545;
        }
        
        .toast.info {
            background: #17a2b8;
        }
    </style>
</head>
<body>
    <!-- Navegación -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h1>📋 Sistema de Facturas CR</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="facturas.html" class="nav-link active">Ver Facturas</a></li>
                <li><a href="productos-relacionados.html" class="nav-link">Gestionar Relaciones</a></li>
                <li><a href="precios.html" class="nav-link">Revisar Precios</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Header con botón de actualizar -->
        <div class="header-actions">
            <div class="header">
                <h1>📄 Lista de Facturas</h1>
                <p>Buscar y relacionar productos por factura</p>
            </div>
            <button onclick="actualizarFacturas()" class="btn-actualizar" id="btnActualizar">
                🔄 Actualizar Facturas
            </button>
        </div>

        <!-- Filtros y búsqueda -->
        <div class="card">
            <div class="filters-section">
                <div class="search-box">
                    <input type="text" id="buscarFactura" placeholder="Buscar por número de factura, proveedor o clave..." class="search-input">
                    <button onclick="buscarFacturas()" class="btn">🔍 Buscar</button>
                </div>
                
                <div class="filter-row">
                    <select id="filtroEstado" class="filter-select" onchange="buscarFacturas()">
                        <option value="TODAS">Todos los estados</option>
                        <option value="PROCESADA">Procesadas</option>
                        <option value="RELACIONADA">Relacionadas</option>
                        <option value="COMPLETADA">Completadas</option>
                    </select>
                    
                    <input type="text" id="filtroProveedor" placeholder="Filtrar por proveedor..." class="filter-input" onkeyup="buscarFacturas()">
                    
                    <button onclick="limpiarFiltros()" class="btn btn-secondary">Limpiar</button>
                </div>
            </div>
        </div>

        <!-- Lista de facturas -->
        <div class="card">
            <div class="card-header">
                <h2>📋 Facturas Encontradas</h2>
                <div id="resultadosInfo" class="results-info"></div>
            </div>
            
            <div id="listaFacturas" class="facturas-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Cargando facturas...</p>
                </div>
            </div>
            
            <!-- Paginación -->
            <div id="paginacion" class="pagination" style="display: none;">
                <button id="btnAnterior" onclick="cambiarPagina(-1)" class="btn btn-secondary">‹ Anterior</button>
                <span id="infoPagina">Página 1 de 1</span>
                <button id="btnSiguiente" onclick="cambiarPagina(1)" class="btn btn-secondary">Siguiente ›</button>
            </div>
        </div>
    </div>

    <!-- Toast para notificaciones -->
    <div id="toast" class="toast"></div>

    <script src="js/facturas.js"></script>
    <script>
        // Función para mostrar toast
        function mostrarToast(mensaje, tipo = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = `toast ${tipo}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // Función para actualizar facturas
        async function actualizarFacturas() {
            const btn = document.getElementById('btnActualizar');
            
            // Mostrar estado de carga
            btn.classList.add('loading');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<span style="opacity: 0;">Actualizando...</span>';
            
            // Mostrar toast de inicio
            mostrarToast('🔄 Procesando actualización de facturas...', 'info');
            
            try {
                // Realizar la petición al procesador
                const response = await fetch('https://sistema-facturas-procesador.onrender.com', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    // Éxito
                    mostrarToast('✅ ¡Facturas actualizadas correctamente!', 'success');
                    
                    // Recargar la lista de facturas
                    setTimeout(() => {
                        if (typeof buscarFacturas === 'function') {
                            buscarFacturas();
                        } else {
                            window.location.reload();
                        }
                    }, 2000);
                } else {
                    throw new Error('Error en la respuesta del servidor');
                }
            } catch (error) {
                console.error('Error al actualizar facturas:', error);
                mostrarToast('⚠️ Error al actualizar facturas. Intenta nuevamente.', 'error');
            } finally {
                // Restaurar botón
                btn.classList.remove('loading');
                btn.innerHTML = textoOriginal;
            }
        }
    </script>
</body>
</html>
