<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      El icono de la pestaña apuntaba a /vite.svg, que nunca existió en este
      proyecto: cada carga pedía ese archivo, recibía un 404 y la pestaña
      quedaba con el icono en blanco del navegador.

      El SVG es el que usan los navegadores modernos y se ve nítido en
      cualquier tamaño; los PNG son el respaldo para los que no lo soportan.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    
    <!-- Viewport optimizado para PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>Distribuidora Tachi - Sistema de Facturación</title>
    <meta name="description" content="Sistema integrado de facturación y gestión para Distribuidora Tachi" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Color para barra de estado -->
    <!-- El azul del sistema (primario-800), no el genérico de la plantilla. -->
    <meta name="theme-color" content="#12263f" />
    <meta name="msapplication-TileColor" content="#12263f" />
    
    <!-- Apple iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Distribuidora Tachi" />
    
    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Prevenir zoom en iOS -->
    <meta name="format-detection" content="telephone=no" />
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
