name: Actualizar Facturas
on:
  workflow_dispatch:
  schedule:
    # Ejecutar cada 2 horas de 8AM a 6PM (hora UTC)
    - cron: '0 8,10,12,14,16,18 * * 1-5'
    
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --production
      
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      - name: Ejecutar sistema de facturas
        run: timeout 10m node server.js || echo "Proceso completado o timeout alcanzado"
        env:
          ALEGRA_TOKEN: ${{ secrets.ALEGRA_TOKEN }}
          ALEGRA_USER: ${{ secrets.ALEGRA_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          PRISMA_GENERATE_SKIP_DOWNLOAD: ${{ secrets.PRISMA_GENERATE_SKIP_DOWNLOAD }}
          RENDER_EXTERNAL_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
      
      - name: Verificar resultados
        run: |
          echo "✅ Proceso de actualización completado"
          echo "📊 Timestamp: $(date)"
